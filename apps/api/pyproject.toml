[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "carryme-api"
version = "0.1.0"
description = "FastAPI application for the carryme operator/control plane."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "carryme-models",
  "carryme-normalizers",
  "carryme-runtime",
  "carryme-storage",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
carryme-api = "carryme_api.main:main"
carryme-api-migrate-and-start = "carryme_api.main:migrate_and_start"

[tool.hatch.build.targets.wheel]
packages = ["src/carryme_api"]

[tool.uv.sources]
carryme-models = { workspace = true }
carryme-normalizers = { workspace = true }
carryme-runtime = { workspace = true }
carryme-storage = { workspace = true }
