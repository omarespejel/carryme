name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install workspace and dev dependencies
        run: uv sync --all-packages --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy $(find src apps packages tests -name '*.py' -type f)

      - name: Pytest
        run: uv run pytest
