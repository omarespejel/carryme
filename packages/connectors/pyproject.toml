[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "carryme-connectors"
version = "0.1.0"
description = "Public venue connectors for Extended, Paradex, and Hyperliquid."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "carryme-models",
  "ecdsa>=0.19,<1",
  "fast-stark-crypto==0.3.8",
  "httpx>=0.28,<1",
  "hyperliquid-python-sdk>=0.22,<0.23",
  "pycryptodome>=3.23,<4",
  "starknet-crypto-py>=0.3,<0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/carryme_connectors"]

[tool.uv.sources]
carryme-models = { workspace = true }
