[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "carryme-scoring"
version = "0.1.0"
description = "Scoring and ranking for carryme funding opportunities."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "carryme-models",
]

[tool.hatch.build.targets.wheel]
packages = ["src/carryme_scoring"]

[tool.uv.sources]
carryme-models = { workspace = true }
